name: Générer modèles Word

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/generate_word_templates.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer python-docx
        run: pip install python-docx

      - name: Générer les modèles Word
        run: python .github/scripts/generate_word_templates.py

      - name: Commit et push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/templates/fiche-modele.docx assets/templates/memo-modele.docx
          if git diff --cached --quiet; then
            echo "Aucune modification."
          else
            git commit -m "feat: modèles Word fiche animateur + mémo participant"
            git push origin main
          fi
